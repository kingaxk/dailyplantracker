<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rytuały dnia</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rytuały dnia">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F3F5EF">
<link rel="manifest" id="rd-manifest-link" href="">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap');
  :root{
    --bg:#F3F5EF; --bg-card:#FFFFFF; --ink:#2B3328; --ink-soft:#5B6459;
    --line:#E1E5DA; --accent:#8B5A6B; --gold:#C9A66B;
    --c-morning:#D98B5A; --c-physical:#6E9B7A; --c-meals:#A9724A;
    --c-growth:#6C82A6; --c-self_focus:#9C86A8; --c-social:#C97288; --c-evening:#55647F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:'Karla',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);}
  button,input,select,textarea{font-family:inherit;color:inherit;}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}

  .rd-root{min-height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:var(--bg);position:relative;}
  .rd-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 4px;gap:8px;}
  .rd-title{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:22px;color:var(--ink);}
  .rd-gear{background:none;border:none;cursor:pointer;padding:6px;font-size:19px;color:var(--ink-soft);line-height:1;}
  .rd-main{flex:1;padding:8px 18px 24px;}
  .rd-sync{font-size:11px;padding:2px 10px;border-radius:999px;white-space:nowrap;}
  .rd-sync.saving{color:var(--ink-soft);}
  .rd-sync.saved{color:#5B7355;}
  .rd-sync.error, .rd-sync.reauth{color:#B23A3A;}
  .rd-reauthbar{background:#F6E4E4;color:#7A2E2E;font-size:13px;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .rd-reauthbar button{background:#7A2E2E;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;}

  .rd-daynav{display:flex;align-items:center;justify-content:space-between;margin-top:4px;}
  .rd-daynav button{background:none;border:none;cursor:pointer;padding:8px;font-size:18px;color:var(--ink-soft);}
  .rd-daydate{font-family:'Fraunces',Georgia,serif;font-size:18px;font-weight:600;color:var(--ink);text-transform:capitalize;text-align:center;}
  .rd-backtoday{font-size:11px;color:var(--accent);background:none;border:none;cursor:pointer;text-decoration:underline;margin-top:2px;display:block;}

  .rd-dayarc{display:flex;gap:6px;margin:14px 0 6px;}
  .rd-dayarc-seg{flex:1;height:36px;border-radius:8px;border:none;position:relative;overflow:hidden;cursor:pointer;padding:0;}
  .rd-dayarc-fill{position:absolute;left:0;bottom:0;width:100%;transition:height .35s ease;}
  .rd-daysummary{text-align:center;font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
  .rd-nutrition-card{background:var(--bg-card);border-radius:14px;padding:14px 16px;margin:10px 0;box-shadow:0 1px 3px rgba(43,51,40,0.06);}
  .rd-nutrition-kcal{font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--ink);text-align:center;margin-bottom:8px;}
  .rd-nutrition-macro{display:flex;justify-content:center;gap:16px;font-size:13px;color:var(--ink-soft);flex-wrap:wrap;}
  .rd-nutrition-macro b{color:var(--ink);}
  .rd-schedule-row{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start;}
  .rd-schedule-time{flex-shrink:0;width:44px;font-family:'Fraunces',serif;font-weight:600;font-size:13px;color:var(--ink-soft);padding-top:13px;text-align:right;}
  .rd-schedule-content{flex:1;background:var(--bg-card);border-radius:12px;box-shadow:0 1px 3px rgba(43,51,40,0.06);overflow:hidden;min-width:0;}
  .rd-schedule-remove{flex-shrink:0;width:32px;height:32px;margin-top:9px;border-radius:50%;border:none;background:none;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .rd-schedule-remove:hover{color:var(--accent);background:var(--bg);}

  .rd-cat{margin-top:22px;}
  .rd-cat-head{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;padding:4px 0;cursor:pointer;}
  .rd-cat-bar{width:4px;height:22px;border-radius:2px;flex-shrink:0;}
  .rd-cat-name{font-weight:700;font-size:15px;color:var(--ink);}
  .rd-cat-count{margin-left:auto;font-size:13px;color:var(--ink-soft);}
  .rd-cat-chev{font-size:14px;color:var(--ink-soft);width:14px;text-align:center;}
  .rd-cat-body{background:var(--bg-card);border-radius:14px;margin-top:8px;box-shadow:0 1px 3px rgba(43,51,40,0.06);}

  .rd-row{display:flex;align-items:center;gap:12px;padding:12px 14px;}
  .rd-check{width:26px;height:26px;border-radius:50%;flex-shrink:0;border:2px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .rd-check.done{background:var(--cat-color,var(--accent));border-color:var(--cat-color,var(--accent));}
  .rd-check svg{display:none;}
  .rd-check.done svg{display:block;}
  .rd-row-main{flex:1;display:flex;align-items:center;justify-content:space-between;background:none;border:none;cursor:pointer;padding:0;text-align:left;gap:8px;}
  .rd-row-name{font-size:15px;color:var(--ink);}
  .rd-row-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .rd-note-dot{width:6px;height:6px;border-radius:3px;background:var(--gold);}
  .rd-count-badge{font-size:12px;color:var(--ink-soft);}
  .rd-chev{font-size:14px;color:var(--ink-soft);}

  .rd-detail{padding:0 14px 14px 52px;}
  .rd-textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;color:var(--ink);resize:vertical;background:#FAFBF8;}
  .rd-sublist{display:flex;flex-direction:column;gap:8px;}
  .rd-sublabel{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;}
  .rd-qty-btn{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--bg-card);color:var(--ink);font-size:15px;line-height:1;cursor:pointer;padding:0;}
  .rd-sublabel input{width:18px;height:18px;}
  .rd-hint{font-size:13px;color:var(--ink-soft);}

  .rd-logentry{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);}
  .rd-logentry span:first-child{flex:1;font-size:14px;}
  .rd-logentry span{font-size:13px;color:var(--ink-soft);}
  .rd-logentry button{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:15px;}
  .rd-logform{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .rd-logform input{padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;}
  .rd-logform input.rd-log-main{flex:1 1 100%;}
  .rd-logform input.rd-log-sub{flex:1 1 80px;min-width:70px;}
  .rd-logadd{display:flex;align-items:center;gap:4px;padding:8px 12px;border-radius:8px;border:none;color:#fff;font-size:13px;cursor:pointer;}

  .rd-select{margin-left:auto;flex:1;max-width:180px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;background:#fff;color:var(--ink);}

  .rd-h2{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:600;color:var(--ink);margin:4px 0 16px;}
  .rd-h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin:0 0 10px;}

  .rd-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;}
  .rd-chip{flex-shrink:0;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-size:13px;cursor:pointer;white-space:nowrap;}
  .rd-chip.active{color:#fff;}

  .rd-empty{padding:30px 20px;text-align:center;color:var(--ink-soft);font-size:14px;background:var(--bg-card);border-radius:14px;}
  .rd-loading{padding:40px 0;text-align:center;color:var(--ink-soft);font-size:14px;}

  .rd-notecard{text-align:left;background:var(--bg-card);border:none;border-radius:12px;padding:14px;cursor:pointer;box-shadow:0 1px 3px rgba(43,51,40,0.06);width:100%;display:block;margin-bottom:10px;}
  .rd-notecard-top{display:flex;justify-content:space-between;margin-bottom:6px;}
  .rd-notecard-item{font-size:12px;font-weight:700;}
  .rd-notecard-date{font-size:12px;color:var(--ink-soft);}
  .rd-notecard-text{font-size:14px;color:var(--ink);margin:0;white-space:pre-wrap;}

  .rd-rangechips{display:flex;gap:8px;margin-bottom:16px;}
  .rd-rangechip{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;}
  .rd-rangechip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .rd-daterange{display:flex;gap:8px;margin-bottom:16px;}
  .rd-daterange input{flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;}

  .rd-stats{display:flex;gap:12px;margin-bottom:20px;}
  .rd-stat{flex:1;background:var(--bg-card);border-radius:14px;padding:16px 14px;box-shadow:0 1px 3px rgba(43,51,40,0.06);}
  .rd-stat-label{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .rd-stat-value{font-family:'Fraunces',Georgia,serif;font-size:26px;font-weight:600;color:var(--ink);}

  .rd-barlist{background:var(--bg-card);border-radius:14px;padding:14px 16px;margin-bottom:20px;display:flex;flex-direction:column;gap:10px;}
  .rd-bar-row{display:flex;align-items:center;gap:10px;}
  .rd-bar-name{width:150px;flex-shrink:0;font-size:12px;color:var(--ink);}
  .rd-bar-track{flex:1;height:12px;border-radius:6px;background:var(--line);overflow:hidden;}
  .rd-bar-fill{height:100%;border-radius:6px;}
  .rd-bar-pct{width:34px;flex-shrink:0;font-size:12px;color:var(--ink-soft);text-align:right;}

  .rd-heatmap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;}
  .rd-heatcell{width:30px;height:30px;border-radius:7px;border:none;cursor:pointer;}

  .rd-bestworst{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;font-size:13px;color:var(--ink-soft);}
  .rd-bestworst strong{color:var(--ink);}

  .rd-bottomnav{position:sticky;bottom:0;background:var(--bg-card);border-top:1px solid var(--line);display:flex;}
  .rd-tab{flex:1;display:flex;align-items:center;justify-content:center;padding:14px 0 calc(10px + env(safe-area-inset-bottom));background:none;border:none;cursor:pointer;color:var(--ink-soft);position:relative;}
  .rd-tab.active::after{content:"";position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:16px;height:3px;border-radius:2px;background:var(--accent);}
  .rd-tab.active{color:var(--accent);font-weight:700;}
  .rd-fulltext{padding:12px 0 4px;}
  .rd-recipe-desc{font-size:13px;color:var(--ink-soft);font-style:italic;margin:0 0 12px;}
  .rd-recipe-subh{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:14px 0 6px;}
  .rd-recipe-ing{margin:0;padding-left:18px;font-size:14px;color:var(--ink);}
  .rd-recipe-ing li{margin-bottom:4px;}
  .rd-recipe-steps{margin:0;padding-left:18px;font-size:14px;color:var(--ink);}
  .rd-recipe-steps li{margin-bottom:8px;line-height:1.4;}
  .rd-recipe-note{font-size:13px;color:var(--ink-soft);background:var(--bg);border-radius:8px;padding:10px;margin-top:10px;}

  .rd-overlay{position:fixed;inset:0;background:rgba(43,51,40,0.4);z-index:50;display:flex;align-items:flex-end;}
  .rd-sheet{background:var(--bg);width:100%;max-height:85vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));}
  .rd-sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .rd-sheet-title{font-family:'Fraunces',Georgia,serif;font-size:20px;margin:0;color:var(--ink);}
  .rd-sheet-close{background:none;border:none;cursor:pointer;font-size:22px;color:var(--ink);line-height:1;}

  .rd-supplist{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
  .rd-suppitem{display:flex;align-items:center;justify-content:space-between;background:var(--bg-card);border-radius:8px;padding:8px 12px;}
  .rd-suppitem span{font-size:14px;}
  .rd-suppitem button{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:13px;text-decoration:underline;}
  .rd-suppadd{display:flex;gap:8px;margin-bottom:24px;}
  .rd-suppadd input{flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--line);font-size:14px;}
  .rd-suppadd button{padding:0 16px;border-radius:8px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:18px;}

  .rd-settingsbtns{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .rd-settingsbtn{display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;cursor:pointer;}
  .rd-status{font-size:13px;color:var(--ink-soft);}

  .rd-setup{max-width:440px;margin:0 auto;padding:50px 24px;}
  .rd-setup h1{font-family:'Fraunces',Georgia,serif;font-size:24px;margin-bottom:6px;}
  .rd-setup p{font-size:14px;line-height:1.6;color:var(--ink-soft);}
  .rd-setup label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:18px 0 6px;}
  .rd-setup input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);font-size:14px;}
  .rd-setup button{margin-top:22px;width:100%;padding:14px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
  .rd-setup button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:10px;}
  .rd-setup .rd-error{color:#B23A3A;font-size:13px;margin-top:12px;}
  .rd-google-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;width:100%;margin-top:22px;}
</style>
</head>

<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore-compat.js"></script>

<script>
/* ============================== CONTENT CONFIG ============================== */
const CATEGORIES = [

    { id:"scent_music", name:"Zapach + muzyka", type:"note", notePrompt:"Jaki mam nastrój z rana?" },

    { id:"supplements", name:"Shot odpornościowy + suplementy/leki", type:"nested", subItems:[], editable:true },

function describeMealSelection(mealData){
  if(!mealData || !mealData.recipeId) return "";
  if(mealData.recipeId==="_kupne") return "Kupne"+(mealData.note?": "+mealData.note:"");
  if(mealData.recipeId==="_inne"){
    let s = "Inne"+(mealData.note?": "+mealData.note:"");
    const extra = mealData.extraIngredients||[];
    if(extra.length) s += " [składniki: "+extra.map(function(i){return i.name+" "+fmtAmountSimple(i.amount)+" "+i.unit;}).join(", ")+"]";
    return s;
  }
  const recipe = findRecipe(mealData.recipeId);
  if(!recipe) return "";
  const parts = [recipe.name];
  const variantParts = [];
  (recipe.variantGroups||[]).forEach(function(g){
    const chosen = mealData.variants && mealData.variants[g.id];
    const opt = chosen && g.options.find(function(o){ return o.id===chosen; });
    if(opt && opt.id!=="brak") variantParts.push(g.label+": "+opt.label);
  });
  if(variantParts.length) parts.push("("+variantParts.join(", ")+")");
  const addons = mealData.addons || {};
  const addonNames = Object.keys(addons).map(function(id){
    const addon = findAddon(id);
    if(!addon) return null;
    const sel = addons[id];
    let label = addon.name;
    if(addon.variantGroups && addon.variantGroups.length){
      const extra = addon.variantGroups.map(function(g){
        const chosen = sel.variants && sel.variants[g.id];
        const opt = chosen && g.options.find(function(o){ return o.id===chosen; });
        return opt ? opt.label : null;
      }).filter(Boolean);
      if(extra.length) label += " ("+extra.join(", ")+")";
    }
    return label;
  }).filter(Boolean);
  if(addonNames.length) parts.push("+ Dodatki: "+addonNames.join(", "));
  return parts.join(" ");
}

function computeMealIngredients(mealData){
  const results = [];
  if(!mealData || !mealData.recipeId) return results;
  if(mealData.recipeId==="_kupne") return results;
  if(mealData.recipeId==="_inne"){
    (mealData.extraIngredients||[]).forEach(function(ing){ results.push({ name:ing.name, amount:ing.amount, unit:ing.unit, source:"Inne" }); });
    return results;
  }
  const recipe = findRecipe(mealData.recipeId);
  if(!recipe) return results;
  const scale = 1/(recipe.portions||1);
  (recipe.fixed||[]).forEach(function(ing){ results.push({ name:ing.name, amount:ing.amount*scale, unit:ing.unit, source:recipe.name }); });
  (recipe.variantGroups||[]).forEach(function(g){
    const chosen = mealData.variants && mealData.variants[g.id];
    const opt = chosen && g.options.find(function(o){ return o.id===chosen; });
    if(opt){ (opt.ingredients||[]).forEach(function(ing){ results.push({ name:ing.name, amount:ing.amount*scale, unit:ing.unit, source:recipe.name }); }); }
  });
  const addons = mealData.addons || {};
  Object.keys(addons).forEach(function(addonId){
    const addon = findAddon(addonId);
    if(!addon) return;
    const addonSel = addons[addonId] || {};
    const aScale = (1/(addon.portions||1)) * (addonSel.qty || 1);
    (addon.fixed||[]).forEach(function(ing){ results.push({ name:ing.name, amount:ing.amount*aScale, unit:ing.unit, source:addon.name }); });
    (addon.variantGroups||[]).forEach(function(g){
      const chosen = addonSel.variants && addonSel.variants[g.id];
      const opt = chosen && g.options.find(function(o){ return o.id===chosen; });
      if(opt){ (opt.ingredients||[]).forEach(function(ing){ results.push({ name:ing.name, amount:ing.amount*aScale, unit:ing.unit, source:addon.name }); }); }
    });
  });
  return results;
}

function ingredientNutrition(name, amount, unit){
  const key = name.trim().toLowerCase();
  const unitKey = unit.trim().toLowerCase();
  const perUnitKey = key+"|"+unitKey;
  if(NUTRITION_PER_UNIT[perUnitKey]){
    const v = NUTRITION_PER_UNIT[perUnitKey];
    return { protein: v[0]*amount, carbs: v[1]*amount, fat: v[2]*amount };
  }
  const per100 = NUTRITION_DB[key];
  if(!per100) return null;
  let grams;
  if(unitKey==="g" || unitKey==="ml") grams = amount;
  else if(NUTRITION_UNIT_G[unitKey] !== undefined) grams = amount * NUTRITION_UNIT_G[unitKey];
  else if(unitKey==="sztuka") grams = amount * 100;
  else if(unitKey==="ząbek") grams = amount * 3;
  else if(unitKey==="kromka") grams = amount * 30;
  else grams = amount;
  return { protein: per100[0]*grams/100, carbs: per100[1]*grams/100, fat: per100[2]*grams/100 };
}

function computeMealNutrition(mealData){
  const ings = computeMealIngredients(mealData);
  let protein=0, carbs=0, fat=0, unknown=false;
  ings.forEach(function(ing){
    const n = ingredientNutrition(ing.name, ing.amount, ing.unit);
    if(!n){ unknown=true; return; }
    protein += n.protein; carbs += n.carbs; fat += n.fat;
  });
  return { protein:protein, carbs:carbs, fat:fat, kcal: protein*4+carbs*4+fat*9, unknown:unknown };
}

function computeDayNutrition(dateStr){
  const dayItems = getDayItems(dateStr).items;
  let protein=0, carbs=0, fat=0, kcal=0, anyMeal=false, anyUnknown=false, anyUnpriced=false;
  MEAL_SLOT_IDS.forEach(function(slotId){
    const mealData = dayItems[slotId];
    if(!mealData || !mealData.recipeId) return;
    anyMeal = true;
    if(mealData.recipeId==="_kupne"){
      if(mealData.manualKcal){ kcal += mealData.manualKcal; }
      else { anyUnpriced = true; }
      return;
    }
    const n = computeMealNutrition(mealData);
    protein += n.protein; carbs += n.carbs; fat += n.fat; kcal += n.kcal;
    if(n.unknown) anyUnknown = true;
  });
  return { protein:protein, carbs:carbs, fat:fat, kcal:kcal, anyMeal:anyMeal, anyUnknown:anyUnknown, anyUnpriced:anyUnpriced };
}

function dateRangeList(startStr,endStr){ const arr=[]; let cur=startStr, guard=0; while(cur<=endStr && guard<400){ arr.push(cur); cur=addDays(cur,1); guard++; } return arr; }

function isTypingActively(){
  const active = document.activeElement;
  const appEl = document.getElementById("app");
  return !!(active && (active.tagName==="TEXTAREA" || active.tagName==="INPUT") && appEl && appEl.contains(active));
}

async function pushRow(date, itemId, category, itemName, done, note, extraObj){
  const k = keyFor(date, itemId);
  const localRow = { Date:date, ItemId:itemId, Category:category||"", ItemName:itemName||"", Done: done?"TRUE":"FALSE", Note: note||"", ExtraJSON: JSON.stringify(extraObj), UpdatedAt: new Date().toISOString() };
  const idx = sheetRows.findIndex(function(r){ return r.Date===date && r.ItemId===itemId; });
  if(idx===-1) sheetRows.push(localRow); else sheetRows[idx] = localRow;
  rowIndexMap[k] = localRow;

  pendingSync.add(k);
  syncStatus = "saving";
  // While she's actively typing in THIS note's textarea, skip re-rendering entirely —
  // destroying and recreating the textarea (even briefly) closes the mobile keyboard,
  // and a programmatic focus() call afterwards often can't reopen it (especially iOS).
  if(!isTypingActively()) render();

  try{
    await db.collection("users").doc(currentUser.uid).collection("entries").doc(entryDocId(date,itemId)).set(localRow);
    pendingSync.delete(k);
    syncStatus = pendingSync.size ? "saving" : "saved";
  }catch(e){
    pendingSync.delete(k);
    syncStatus = "error";
  }
  if(!isTypingActively()) render();
}

function updateDayItem(dateStr, itemId, updater){
  const day = getDayItems(dateStr);
  const prevItems = day.items || {};
  const newData = updater(prevItems[itemId] || {});
  const meta = findItemMeta(itemId);
  if(!meta){
    pushRow(dateStr, itemId, "", "", false, "", newData);
    return;
  }
  const done = isItemDone(meta, newData);
  const note = meta.type==="note" ? (newData.note||"") : "";
  pushRow(dateStr, itemId, meta.catName, meta.name, done, note, newData);
}

/* ============================== COMPLETION LOGIC ============================== */
function isItemDone(item,data){
  if(!data) return false;
  switch(item.type){
    case "simple": case "note": return !!data.done;
    case "nested": return !!data.done;
    case "log": return !!(data.logEntries && data.logEntries.length>0);
    case "meal": return !!data.mealValue;
    case "recipe_meal": return !!(data && data.recipeId);
    case "counter": return !!(data.count && data.count>0);
    default: return false;
  }
}
function computeDayTotals(dayData){
  let done=0,total=0; const perCategory={};
  const items=(dayData && dayData.items)||{};
  CATEGORIES.forEach(function(cat){
    let cDone=0;
    cat.items.forEach(function(item){ if(isItemDone(item,items[item.id])){cDone++;} });
    if(cat.countAsOne){
      const oneDone = cDone>0 ? 1 : 0;
      perCategory[cat.id] = { done:cDone, total:cat.items.length, pct: oneDone };
      if(!cat.negative){ done += oneDone; total += 1; }
    } else {
      perCategory[cat.id] = { done:cDone, total:cat.items.length, pct: cat.items.length? cDone/cat.items.length : 0 };
      if(!cat.negative){ done += cDone; total += cat.items.length; }
    }
  });
  return { done:done, total:total, pct: total? done/total : 0, perCategory:perCategory };
}

function getStableSelector(el){
  if(el.id) return "#"+el.id.replace(/([^a-zA-Z0-9_-])/g, "\\$1");
  const attrs = [];
  for(let i=0;i<el.attributes.length;i++){
    const attr = el.attributes[i];
    if(attr.name.indexOf("data-")===0){ attrs.push('['+attr.name+'="'+attr.value.replace(/"/g,'\\"')+'"]'); }
  }
  if(attrs.length) return el.tagName.toLowerCase()+attrs.join("");
  return null;
}

function render(){
  const app = document.getElementById("app");
  let focusInfo = null;
  const active = document.activeElement;
  if(active && app.contains(active) && (active.tagName==="TEXTAREA" || active.tagName==="INPUT")){
    const sel = getStableSelector(active);
    if(sel){
      focusInfo = { sel:sel, start: active.selectionStart, end: active.selectionEnd };
    }
  }

  renderInner(app);

  if(focusInfo){
    try{
      const newEl = app.querySelector(focusInfo.sel);
      if(newEl){
        newEl.focus();
        if(typeof focusInfo.start==="number" && newEl.setSelectionRange){
          try{ newEl.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
        }
      }
    }catch(e){ /* selector edge case - not worth failing the render over */ }
  }
}

  html += '<div class="rd-dayarc">' + HABIT_CATEGORIES.filter(function(cat){ return !cat.negative; }).map(function(cat){
    const pct = totals.perCategory[cat.id].pct;
    const h = Math.max(pct*100,6);
    return '<button class="rd-dayarc-seg" data-action="jump-cat" data-cat="'+cat.id+'" title="'+escapeHTML(cat.name)+'" style="background:'+CATEGORY_HEX[cat.id]+'22"><div class="rd-dayarc-fill" style="height:'+h+'%;background:'+CATEGORY_HEX[cat.id]+'"></div></button>';
  }).join('') + '</div>';

  const habitTotals = HABIT_CATEGORIES.filter(function(cat){ return !cat.negative; }).reduce(function(acc,cat){
    if(cat.countAsOne){ acc.done += totals.perCategory[cat.id].done>0 ? 1 : 0; acc.total += 1; }
    else { acc.done += totals.perCategory[cat.id].done; acc.total += totals.perCategory[cat.id].total; }
    return acc;
  }, {done:0,total:0});
  html += '<div class="rd-daysummary">'+habitTotals.done+'/'+habitTotals.total+' zrealizowanych dziś</div>';
  HABIT_CATEGORIES.forEach(function(cat){ html += renderCategory(cat, dayData); });
  return html;
}

function renderScheduleView(dayData){
  const items = dayData.items || {};
  const template = isWeekday(state.viewDate) ? getWeekdayTemplate() : {};
  const scheduled = [];
  ALL_ITEMS.forEach(function(item){
    const data = items[item.id] || {};
    const actualHours = data.scheduledHours;
    const hours = (actualHours !== undefined) ? actualHours : (template[item.id] || []);
    hours.forEach(function(h){ scheduled.push({ item:item, data:data, hour:h, fromTemplate: actualHours===undefined }); });
  });
  const physData = items["physical_choice"] || {};
  const physActualHours = physData.scheduledHours;
  const physHours = (physActualHours !== undefined) ? physActualHours : (template["physical_choice"] || []);
  physHours.forEach(function(h){ scheduled.push({ isPhysicalPicker:true, hour:h }); });

  scheduled.sort(function(a,b){ return a.hour.localeCompare(b.hour); });

  let html = '<div style="margin:10px 0;">';
  if(scheduled.length===0){
    html += '<p class="rd-hint">Nic jeszcze nie zaplanowano na dziś. Dodaj pierwszą pozycję poniżej.</p>';
  }
  scheduled.forEach(function(row){
    const removeItemId = row.isPhysicalPicker ? "physical_choice" : row.item.id;
    html += '<div class="rd-schedule-row">';
    html += '<div class="rd-schedule-time">'+escapeHTML(row.hour)+'</div>';
    html += '<div class="rd-schedule-content">';
    if(row.isPhysicalPicker){
      html += '<div style="padding:12px 14px 4px">';
      html += '<p class="rd-hint" style="margin:0 0 8px">Trening — wybierz co robisz:</p>';
      html += '</div>';
      const physCat = CATEGORIES.find(function(c){ return c.id==="physical"; });
      physCat.items.forEach(function(pi, idx){
        const pdata = items[pi.id] || {};
        html += renderItemRow(pi, pdata, CATEGORY_HEX.physical, idx===physCat.items.length-1);
      });
    } else {
      const color = CATEGORY_HEX[row.item.catId] || CATEGORY_HEX.morning;
      if(row.item.type==="recipe_meal"){
        html += renderMealSlotRow(row.item, row.data, state.viewDate, "sched|"+row.item.id+"|"+row.hour, true);
      } else {
        html += renderItemRow(row.item, row.data, color, true);
      }
    }
    html += '</div>';
    html += '<button class="rd-schedule-remove" data-action="remove-from-schedule" data-item="'+removeItemId+'" data-hour="'+row.hour+'" title="Usuń z harmonogramu (godz. '+row.hour+')" aria-label="Usuń z harmonogramu">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>' +
      '</button>';
    html += '</div>';
  });
  html += '</div>';

  if(isWeekday(state.viewDate)){
    html += '<button class="rd-hint" style="background:none;border:none;text-decoration:underline;cursor:pointer;margin-bottom:12px;display:block" data-action="save-weekday-template">Zapisz ten dzień jako domyślny plan (pon–pt)</button>';
  }

  if(state.schedulePendingItemId){
    const pendingItem = findItemMeta(state.schedulePendingItemId);
    const pendingName = pendingItem ? pendingItem.name : (state.schedulePendingItemId==="physical_choice" ? "Trening (wybierz aktywność)" : "");
    html += '<div class="rd-nutrition-card">';
    html += '<p class="rd-hint" style="margin:0 0 8px">Wybierz godzinę dla: <strong>'+escapeHTML(pendingName)+'</strong></p>';
    html += '<input type="time" id="schedule-time-input" value="08:00" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);margin-bottom:8px;">';
    html += '<button style="width:100%;padding:10px;border-radius:10px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-weight:700" data-action="confirm-schedule-time">Dodaj do harmonogramu</button>';
    html += '</div>';
  } else if(state.schedulePickerOpen){
    html += '<div class="rd-nutrition-card">';
    html += '<input type="text" placeholder="Szukaj aktywności lub posiłku…" value="'+escapeHTML(state.scheduleSearchQuery)+'" data-action="schedule-search-input" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);margin-bottom:10px;">';
    const q = state.scheduleSearchQuery.trim().toLowerCase();
    const results = ALL_ITEMS.filter(function(it){ return it.catId!=="somatyka" && (!q || it.name.toLowerCase().indexOf(q)!==-1); }).slice(0,30);
    const showPhysicalPicker = !q || "trening".indexOf(q)!==-1 || "aktywność fizyczna".indexOf(q)!==-1;
    html += '<div style="max-height:260px;overflow-y:auto;">';
    if(showPhysicalPicker){
      html += '<button class="rd-row" style="width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);cursor:pointer" data-action="pick-schedule-item" data-item="physical_choice">' +
        '<span class="rd-row-name">Trening (wybierz aktywność)</span>' +
        '<span class="rd-count-badge" style="margin-left:auto">Aktywność fizyczna</span></button>';
    }
    results.forEach(function(it){
      html += '<button class="rd-row" style="width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);cursor:pointer" data-action="pick-schedule-item" data-item="'+it.id+'">' +
        '<span class="rd-row-name">'+escapeHTML(it.name)+'</span>' +
        '<span class="rd-count-badge" style="margin-left:auto">'+escapeHTML(it.catName)+'</span></button>';
    });

    html += '</div>';
    html += '<button class="rd-hint" style="background:none;border:none;text-decoration:underline;cursor:pointer;margin-top:8px" data-action="close-schedule-picker">Anuluj</button>';
    html += '</div>';
  } else {
    html += '<button style="width:100%;padding:12px;border-radius:10px;border:1px dashed var(--line);background:none;color:var(--ink);cursor:pointer;font-weight:600" data-action="open-schedule-picker">+ Dodaj do harmonogramu</button>';
  }
  return html;
}

function renderCategory(cat, dayData){

  const doneCount = cat.items.filter(function(it){return isItemDone(it, items[it.id]);}).length;

  let html = '<section class="rd-cat" id="cat-'+cat.id+'">' +
    '<button class="rd-cat-head" data-action="toggle-cat" data-cat="'+cat.id+'">' +
    '<span class="rd-cat-bar" style="background:'+colorVar+'"></span>' +
    '<span class="rd-cat-name">'+escapeHTML(cat.name)+'</span>' +
    '<span class="rd-cat-count">'+doneCount+'/'+cat.items.length+'</span>' +

      '<span class="rd-chev">'+(expanded?'&#9662;':'&#9656;')+'</span></span></button></div>';

  if(item.type==="counter"){

      html += '<select class="rd-select" style="width:100%;max-width:100%;margin-bottom:10px" data-action="recipe-select" data-item="'+item.id+'"><option value="">— wybierz danie —</option>';

      html += '</select>';
      if(recipe && recipe.variantGroups.length){
        recipe.variantGroups.forEach(function(g){

          g.options.forEach(function(o){ html += '<option value="'+o.id+'" '+(chosen===o.id?'selected':'')+'>'+escapeHTML(o.label)+'</option>'; });
          html += '</select></div>';
        });

      ADDONS.forEach(function(a){

        html += '<label class="rd-sublabel"><input type="checkbox" '+(checked?'checked':'')+' data-action="recipe-addon-toggle" data-item="'+item.id+'" data-addon="'+a.id+'"><span>'+escapeHTML(a.name)+'</span></label>';

            g.options.forEach(function(o){ html += '<option value="'+o.id+'" '+(chosenA===o.id?'selected':'')+'>'+escapeHTML(o.label)+'</option>'; });
            html += '</select>';
          });
        }
      });
      html += '</div></div>';
    }
    html += '</div>';
    return html;
  }
  return "";
}

/* ============================== MEAL PLAN VIEW ============================== */
function fmtAmountSimple(n){
  const r = Math.round(n*10)/10;
  return (r % 1 === 0) ? String(r) : String(r).replace(".",",");
}
function ingredientGrams(amount, unit){
  const unitKey = unit.trim().toLowerCase();
  if(unitKey==="g" || unitKey==="ml") return amount;
  if(NUTRITION_UNIT_G[unitKey] !== undefined) return amount * NUTRITION_UNIT_G[unitKey];
  if(unitKey==="sztuka") return amount * 100;
  if(unitKey==="ząbek") return amount * 3;
  if(unitKey==="kromka") return amount * 30;
  return amount;
}

function computeRecipePortionGrams(recipe, variants){
  let total = 0;
  (recipe.fixed||[]).forEach(function(ing){ total += ingredientGrams(ing.amount, ing.unit); });
  (recipe.variantGroups||[]).forEach(function(g){
    const isOptional = g.label.toLowerCase().indexOf('opcjonalnie')!==-1;
    const chosen = variants && variants[g.id];
    const opt = chosen && g.options.find(function(o){ return o.id===chosen; });
    if(opt){ (opt.ingredients||[]).forEach(function(ing){ total += ingredientGrams(ing.amount, ing.unit); }); }
    else if(!isOptional && g.options.length){
      // no explicit choice made yet - use first real option as a representative estimate
      const fallback = g.options.find(function(o){ return o.label.trim().toLowerCase()!=='bez'; });
      if(fallback) (fallback.ingredients||[]).forEach(function(ing){ total += ingredientGrams(ing.amount, ing.unit); });
    }
  });
  const portions = recipe.portions || 1;
  return { total: total, perPortion: total/portions };
}

function renderFullRecipeText(recipe, variants){
  if(!recipe) return "";
  let html = '<div class="rd-fulltext">';
  if(recipe.description) html += '<p class="rd-recipe-desc">'+escapeHTML(recipe.description)+'</p>';

  const portions = recipe.portions || 1;
  const grams = computeRecipePortionGrams(recipe, variants);
  html += '<p class="rd-hint" style="margin:0 0 10px">' +
    'Porcje: <strong>'+portions+'</strong> &nbsp;•&nbsp; Wielkość porcji: <strong>ok. '+Math.round(grams.perPortion)+' g</strong>' +
    '</p>';

  if((recipe.fixed||[]).length){
    html += '<h4 class="rd-recipe-subh">Składniki</h4><ul class="rd-recipe-ing">';
    recipe.fixed.forEach(function(ing){ html += '<li>'+escapeHTML(ing.name)+' — '+fmtAmountSimple(ing.amount)+' '+escapeHTML(ing.unit)+'</li>'; });
    html += '</ul>';
  }
  (recipe.variantGroups||[]).forEach(function(g){
    const chosen = variants && variants[g.id];
    html += '<h4 class="rd-recipe-subh">'+escapeHTML(g.label)+'</h4><ul class="rd-recipe-ing">';
    g.options.forEach(function(o){
      const isChosen = chosen===o.id;
      const ingText = (o.ingredients||[]).map(function(ing){ return escapeHTML(ing.name)+' — '+fmtAmountSimple(ing.amount)+' '+escapeHTML(ing.unit); }).join(", ");
      html += '<li'+(isChosen?' style="color:var(--accent);font-weight:700"':'')+'>'+(isChosen?'✓ ':'')+escapeHTML(o.label)+(ingText?' — '+ingText:'')+'</li>';
    });
    html += '</ul>';
  });
  if(recipe.instructions && recipe.instructions.length){
    html += '<h4 class="rd-recipe-subh">Wykonanie</h4><ol class="rd-recipe-steps">';
    recipe.instructions.forEach(function(step){ html += '<li>'+escapeHTML(step)+'</li>'; });
    html += '</ol>';
  }
  if(recipe.note) html += '<p class="rd-recipe-note">'+escapeHTML(recipe.note)+'</p>';
  html += '</div>';
  return html;
}

function mealSlotLabel(data){
  if(data.recipeId==="_kupne") return "Kupne"+(data.manualKcal?" ("+data.manualKcal+" kcal)":"");
  if(data.recipeId==="_inne") return "Inne"+(data.note?": "+data.note:"");
  if(data.recipeId){ const r = findRecipe(data.recipeId); if(r) return r.name; }
  return "— wybierz —";
}

function renderKcalLineChart(dates, values){
  const w = 320, h = 140, padL = 30, padR = 8, padT = 14, padB = 20;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const maxV = Math.max.apply(null, values.concat([200]));
  const stepX = values.length>1 ? plotW/(values.length-1) : 0;
  function xFor(i){ return padL + i*stepX; }
  function yFor(v){ return padT + plotH - (v/maxV)*plotH; }
  const pathD = values.map(function(v,i){ return (i===0?'M':'L')+xFor(i).toFixed(1)+','+yFor(v).toFixed(1); }).join(' ');
  let svg = '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:140px;display:block;">';
  [0, Math.round(maxV/2), Math.round(maxV)].forEach(function(gv){
    const gy = yFor(gv);
    svg += '<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+gy.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
    svg += '<text x="2" y="'+(gy+3).toFixed(1)+'" font-size="9" fill="var(--ink-soft)">'+gv+'</text>';
  });
  svg += '<path d="'+pathD+'" fill="none" stroke="var(--accent)" stroke-width="2"/>';
  values.forEach(function(v,i){
    svg += '<circle cx="'+xFor(i).toFixed(1)+'" cy="'+yFor(v).toFixed(1)+'" r="3" fill="var(--accent)"/>';
  });
  const showEvery = dates.length > 9 ? Math.ceil(dates.length/7) : 1;
  dates.forEach(function(d,i){
    if(i % showEvery !== 0 && i !== dates.length-1) return;
    const label = d.slice(8,10)+'.'+d.slice(5,7);
    svg += '<text x="'+xFor(i).toFixed(1)+'" y="'+(h-4)+'" font-size="8" fill="var(--ink-soft)" text-anchor="middle">'+label+'</text>';
  });
  svg += '</svg>';
  return svg;
}

function renderDashboard(){
  let dateList;
  if(state.dashRange==="week") dateList = lastNDays(7, todayStr());
  else if(state.dashRange==="month") dateList = lastNDays(30, todayStr());
  else dateList = dateRangeList(state.dashCustomStart, state.dashCustomEnd);

  const days = dateList.map(function(d){ return { date:d, totals: computeDayTotals(getDayItems(d)) }; });

  let streak = 0, cursor = todayStr();
  for(let i=0;i<400;i++){
    const t = computeDayTotals(getDayItems(cursor));
    if(t.done===0) break;
    streak++; cursor = addDays(cursor,-1);
  }

  const avgPct = days.length ? days.reduce(function(s,d){return s+d.totals.pct;},0)/days.length : 0;
  const catAverages = CATEGORIES.filter(function(cat){ return !cat.negative; }).map(function(cat){
    const avg = days.length ? days.reduce(function(s,d){return s+d.totals.perCategory[cat.id].pct;},0)/days.length : 0;
    return { id:cat.id, name:cat.name, pct: Math.round(avg*100) };
  });
  const sortedDays = days.slice().sort(function(a,b){return b.totals.pct-a.totals.pct;});
  const best = sortedDays[0], worst = sortedDays[sortedDays.length-1];

  let html = '<h2 class="rd-h2">Dashboard</h2>';
  html += '<div class="rd-rangechips">' +
    ["week","month","custom"].map(function(r){
      const label = r==="week"?"Tydzień":r==="month"?"Miesiąc":"Własny";
      return '<button class="rd-rangechip'+(state.dashRange===r?" active":"")+'" data-action="set-range" data-range="'+r+'">'+label+'</button>';
    }).join('') + '</div>';

  if(state.dashRange==="custom"){
    html += '<div class="rd-daterange">' +
      '<input type="date" value="'+state.dashCustomStart+'" max="'+state.dashCustomEnd+'" data-action="set-custom-start">' +
      '<input type="date" value="'+state.dashCustomEnd+'" min="'+state.dashCustomStart+'" max="'+todayStr()+'" data-action="set-custom-end">' +
      '</div>';
  }

  html += '<div class="rd-stats">' +
    '<div class="rd-stat"><div class="rd-stat-label">Średnia realizacja</div><div class="rd-stat-value">'+Math.round(avgPct*100)+'%</div></div>' +
    '<div class="rd-stat"><div class="rd-stat-label">🔥 Passa</div><div class="rd-stat-value">'+streak+' '+(streak===1?'dzień':'dni')+'</div></div>' +
    '</div>';

  html += '<h3 class="rd-h3">Realizacja wg kategorii</h3><div class="rd-barlist">';
  catAverages.forEach(function(c){
    html += '<div class="rd-bar-row"><span class="rd-bar-name">'+escapeHTML(c.name)+'</span>' +
      '<div class="rd-bar-track"><div class="rd-bar-fill" style="width:'+c.pct+'%;background:'+CATEGORY_HEX[c.id]+'"></div></div>' +
      '<span class="rd-bar-pct">'+c.pct+'%</span></div>';
  });
  html += '</div>';

  const negativeCats = CATEGORIES.filter(function(cat){ return cat.negative; });
  negativeCats.forEach(function(cat){
    const counts = cat.items.map(function(item){
      const n = days.reduce(function(s,d){
        const dItems = getDayItems(d.date).items;
        return s + (isItemDone(item, dItems[item.id]) ? 1 : 0);
      }, 0);
      return { name:item.name, n:n };
    });
    const totalN = counts.reduce(function(s,c){return s+c.n;},0);
    html += '<h3 class="rd-h3" style="color:'+CATEGORY_HEX[cat.id]+'">'+escapeHTML(cat.name)+'</h3>';
    html += '<div class="rd-barlist" style="border-left:3px solid '+CATEGORY_HEX[cat.id]+'">';
    if(totalN===0){
      html += '<span class="rd-hint">Brak odnotowanych wystąpień w tym zakresie.</span>';
    } else {
      const maxN = Math.max.apply(null, counts.map(function(c){return c.n;}));
      counts.forEach(function(c){
        const pct = maxN ? Math.round(c.n/maxN*100) : 0;
        html += '<div class="rd-bar-row"><span class="rd-bar-name">'+escapeHTML(c.name)+'</span>' +
          '<div class="rd-bar-track"><div class="rd-bar-fill" style="width:'+pct+'%;background:'+CATEGORY_HEX[cat.id]+'"></div></div>' +
          '<span class="rd-bar-pct">'+c.n+'×</span></div>';
      });
    }
    html += '</div>';
  });

  html += '<h3 class="rd-h3">Dni w tym zakresie</h3><div class="rd-heatmap">';
  days.forEach(function(d){
    const alpha = Math.round(30 + d.totals.pct*70).toString(16);
    const bg = d.totals.pct===0 ? 'var(--line)' : ('#8B5A6B'+alpha);
    html += '<button class="rd-heatcell" style="background:'+bg+'" title="'+d.date+': '+Math.round(d.totals.pct*100)+'%" data-action="jump-date" data-date="'+d.date+'"></button>';
  });
  html += '</div>';

  if(best && worst){
    html += '<div class="rd-bestworst">' +
      '<span>Najlepszy dzień: <strong>'+humanDateShort(best.date)+'</strong> ('+Math.round(best.totals.pct*100)+'%)</span>' +
      '<span>Najsłabszy dzień: <strong>'+humanDateShort(worst.date)+'</strong> ('+Math.round(worst.totals.pct*100)+'%)</span>' +
      '</div>';
  }
  return html;
}

/* ============================== SHOPPING LIST VIEW ============================== */
const MEAL_SLOT_IDS = ["breakfast","lunch","dinner","supper"];

// Defensive fallback: if an ingredient ever ends up using a spoon/cup unit
// (instead of the canonical g/ml from recipes-data.js), convert it to ml here
// so it still merges with other ml-based entries of the same ingredient,
// rather than silently showing up as a separate, easy-to-miss line.
const VOLUME_TO_ML = { "łyżka":15, "łyżeczka":5, "szklanka":250 };
function normalizeIngredient(ing){
  if(VOLUME_TO_ML[ing.unit]){
    return { name: ing.name, unit: "ml", amount: ing.amount * VOLUME_TO_ML[ing.unit] };
  }
  return ing;
}

function computeShoppingList(startDate, endDate){
  const dates = dateRangeList(startDate, endDate);
  const allIngredients = [];
  const recipeUsage = {};
  const addonUsage = {};

  dates.forEach(function(d){
    const dayItems = getDayItems(d).items;
    MEAL_SLOT_IDS.forEach(function(slotId){
      const mealData = dayItems[slotId];
      if(!mealData || !mealData.recipeId) return;
      if(mealData.recipeId!=="_kupne" && mealData.recipeId!=="_inne"){
        recipeUsage[mealData.recipeId] = (recipeUsage[mealData.recipeId]||0)+1;
      }
      computeMealIngredients(mealData).forEach(function(ing){ allIngredients.push(ing); });
      const addons = mealData.addons || {};
      Object.keys(addons).forEach(function(aid){ addonUsage[aid] = (addonUsage[aid]||0)+1; });
    });
  });

  const merged = {};
  allIngredients.forEach(function(ing){
    const norm = normalizeIngredient(ing);
    const cleanName = norm.name.trim();
    const key = cleanName.toLowerCase()+"|"+norm.unit;
    if(!merged[key]) merged[key] = { name:cleanName, unit:norm.unit, amount:0 };
    merged[key].amount += norm.amount;
  });
  const list = Object.keys(merged).map(function(k){ return merged[k]; }).sort(function(a,b){ return a.name.localeCompare(b.name,"pl"); });

  return { list:list, recipeUsage:recipeUsage, addonUsage:addonUsage };
}

function fmtAmount(n){
  const r = Math.round(n*10)/10;
  return (r % 1 === 0) ? String(r) : String(r).replace(".",",");
}

function renderShopping(){
  const result = computeShoppingList(state.shopStart, state.shopEnd);
  let html = '<h2 class="rd-h2">Lista zakupów</h2>';
  html += '<div class="rd-daterange">' +
    '<input type="date" value="'+state.shopStart+'" max="'+state.shopEnd+'" data-action="set-shop-start">' +
    '<input type="date" value="'+state.shopEnd+'" min="'+state.shopStart+'" data-action="set-shop-end">' +
    '</div>';

  if(result.list.length===0){
    html += '<div class="rd-empty">Brak zaplanowanych posiłków (z wybranym daniem) w tym zakresie dat.</div>';
    return html;
  }

  html += '<h3 class="rd-h3">Składniki do kupienia</h3><div class="rd-cat-body" style="margin-bottom:20px">';
  result.list.forEach(function(ing,idx){
    html += '<div class="rd-row"'+(idx===result.list.length-1?' style="border-bottom:none"':'')+'>' +
      '<span class="rd-row-name">'+escapeHTML(ing.name)+'</span>' +
      '<span class="rd-count-badge" style="margin-left:auto">'+fmtAmount(ing.amount)+' '+escapeHTML(ing.unit)+'</span></div>';
  });
  html += '</div>';

  const recipeIds = Object.keys(result.recipeUsage);
  if(recipeIds.length){
    html += '<h3 class="rd-h3">Dania w tym zakresie</h3><div class="rd-cat-body" style="margin-bottom:20px">';
    recipeIds.forEach(function(rid,idx){
      const recipe = findRecipe(rid);
      if(!recipe) return;
      const count = result.recipeUsage[rid];
      const batches = fmtAmount(count/(recipe.portions||1));
      const isLastR = idx===recipeIds.length-1;
      const textOpen = state.expandedRecipeText===rid;
      const dividerR = (isLastR && !textOpen) ? "border-bottom:none;" : "border-bottom:1px solid var(--line);";
      html += '<button class="rd-row" style="width:100%;text-align:left;cursor:pointer;background:none;border:none;'+dividerR+'" data-action="toggle-recipe-text" data-recipe="'+rid+'">' +
        '<span class="rd-row-name">'+escapeHTML(recipe.name)+'</span>' +
        '<span class="rd-count-badge" style="margin-left:auto;text-align:right">'+count+' '+(count===1?'porcja':'porcje')+'<br>(≈ '+batches+'× cały przepis)</span></button>';
      if(textOpen){
        html += '<div style="padding:0 14px 14px;'+(isLastR?'border-bottom:none':'border-bottom:1px solid var(--line)')+'">'+renderFullRecipeText(recipe, null)+'</div>';
      }
    });
    html += '</div>';
  }

  const addonIds = Object.keys(result.addonUsage);
  if(addonIds.length){
    html += '<h3 class="rd-h3">Dodatki w tym zakresie</h3><div class="rd-cat-body">';
    addonIds.forEach(function(aid,idx){
      const addon = findAddon(aid);
      if(!addon) return;
      const count = result.addonUsage[aid];
      const isLastA = idx===addonIds.length-1;
      const textOpen = state.expandedAddonText===aid;
      const dividerA = (isLastA && !textOpen) ? "border-bottom:none;" : "border-bottom:1px solid var(--line);";
      html += '<button class="rd-row" style="width:100%;text-align:left;cursor:pointer;background:none;border:none;'+dividerA+'" data-action="toggle-addon-text" data-addon="'+aid+'">' +
        '<span class="rd-row-name">'+escapeHTML(addon.name)+'</span>' +
        '<span class="rd-count-badge" style="margin-left:auto">×'+count+'</span></button>';
      if(textOpen){
        html += '<div style="padding:0 14px 14px;'+(isLastA?'border-bottom:none':'border-bottom:1px solid var(--line)')+'">'+renderFullRecipeText(addon, null)+'</div>';
      }
    });
    html += '</div>';
  }

  return html;
}

/* ============================== ACTIONS ============================== */
function handleClick(e){
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.getAttribute("data-action");
  if(action==="noop") return;

  if(action==="do-signin"){ doSignIn(); return; }
  if(action==="sign-out"){ state.settingsOpen=false; doSignOut(); return; }

  if(action==="set-tab"){
    const tab = el.getAttribute("data-tab");
    state.activeTab = tab;
    state.expandedItem = null;
    if(tab==="habits") state.collapsedCats = {};
    render(); return;
  }
  if(action==="open-settings"){ state.settingsOpen = true; state.settingsStatus=""; state.manageListId=null; render(); return; }
  if(action==="close-settings" || action==="close-settings-overlay"){ state.settingsOpen = false; state.manageListId=null; render(); return; }
  if(action==="nav-date"){ state.viewDate = addDays(state.viewDate, parseInt(el.getAttribute("data-dir"),10)); state.expandedItem=null; render(); return; }
  if(action==="nav-date-today"){ state.viewDate = todayStr(); state.expandedItem=null; render(); return; }
  if(action==="jump-cat"){
    const target = document.getElementById("cat-"+el.getAttribute("data-cat"));
    if(target) target.scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
  if(action==="jump-date"){ state.viewDate = el.getAttribute("data-date"); state.activeTab="habits"; state.expandedItem=null; render(); return; }
  if(action==="set-habits-view"){
    state.habitsViewMode = el.getAttribute("data-mode");
    state.schedulePickerOpen = false;
    state.schedulePendingItemId = null;
    state.scheduleSearchQuery = "";
    render(); return;
  }
  if(action==="open-schedule-picker"){ state.schedulePickerOpen = true; state.scheduleSearchQuery = ""; render(); return; }
  if(action==="close-schedule-picker"){ state.schedulePickerOpen = false; state.scheduleSearchQuery = ""; render(); return; }
  if(action==="save-weekday-template"){
    const dayData = getDayItems(state.viewDate);
    const items = dayData.items || {};
    const oldTemplate = getWeekdayTemplate();
    const template = {};
    ALL_ITEMS.forEach(function(item){
      const data = items[item.id] || {};
      const actualHours = data.scheduledHours;
      const hours = (actualHours !== undefined) ? actualHours : (oldTemplate[item.id] || []);
      if(hours.length) template[item.id] = hours;
    });
    pushRow("_config", "weekday_schedule", "", "", false, "", template);
    render(); return;
  }
  if(action==="pick-schedule-item"){
    state.schedulePendingItemId = el.getAttribute("data-item");
    state.schedulePickerOpen = false;
    render(); return;
  }
  if(action==="confirm-schedule-time"){
    const timeInput = document.getElementById("schedule-time-input");
    const timeVal = timeInput ? timeInput.value : "08:00";
    const itemId = state.schedulePendingItemId;
    if(itemId && timeVal){
      updateDayItem(state.viewDate, itemId, function(d){
        const template = isWeekday(state.viewDate) ? getWeekdayTemplate() : {};
        const base = (d.scheduledHours !== undefined) ? d.scheduledHours : (template[itemId] || []);
        const next = base.indexOf(timeVal)===-1 ? [...base, timeVal] : base;
        return { ...d, scheduledHours: next };
      });
    }
    state.schedulePendingItemId = null;
    render(); return;
  }
  if(action==="remove-from-schedule"){
    const itemId = el.getAttribute("data-item");
    const hour = el.getAttribute("data-hour");
    updateDayItem(state.viewDate, itemId, function(d){
      const template = isWeekday(state.viewDate) ? getWeekdayTemplate() : {};
      const base = (d.scheduledHours !== undefined) ? d.scheduledHours : (template[itemId] || []);
      const next = base.filter(function(h){ return h!==hour; });
      return { ...d, scheduledHours: next };
    });
    render(); return;
  }
  if(action==="set-meal-mode"){
    state.mealMode = el.getAttribute("data-mode");
    state.expandedMealKey = null;
    state.expandedMealDay = null;
    render(); return;
  }
  if(action==="toggle-meal-slot"){
    const key = el.getAttribute("data-key");
    state.expandedMealKey = state.expandedMealKey===key ? null : key;
    render(); return;
  }
  if(action==="toggle-meal-day"){
    const d = el.getAttribute("data-date");
    state.expandedMealDay = state.expandedMealDay===d ? null : d;
    state.expandedMealKey = null;
    render(); return;
  }
  if(action==="toggle-recipe-text"){
    const rid = el.getAttribute("data-recipe");
    state.expandedRecipeText = state.expandedRecipeText===rid ? null : rid;
    render(); return;
  }
  if(action==="toggle-addon-text"){
    const aid = el.getAttribute("data-addon");
    state.expandedAddonText = state.expandedAddonText===aid ? null : aid;
    render(); return;
  }
  if(action==="toggle-cat"){
    const c = el.getAttribute("data-cat");
    const cur = state.collapsedCats[c] === undefined ? true : state.collapsedCats[c];
    state.collapsedCats[c] = !cur;
    render(); return;
  }
  if(action==="toggle-expand"){ const id=el.getAttribute("data-item"); state.expandedItem = state.expandedItem===id ? null : id; render(); return; }

  if(action==="toggle-done"){
    const id = el.getAttribute("data-item");
    updateDayItem(state.viewDate, id, function(d){ return { ...d, done: !d.done }; });
    render(); return;
  }
  if(action==="toggle-sub"){
    const id = el.getAttribute("data-item");
    const idx = parseInt(el.getAttribute("data-sub-index"),10);
    const meta = findItemMeta(id);
    const subs = getEffectiveList(meta);
    const label = subs[idx];
    updateDayItem(state.viewDate, id, function(d){
      const cur = !!(d.subDone && d.subDone[label]);
      return { ...d, subDone: { ...(d.subDone||{}), [label]: !cur } };
    });
    render(); return;
  }
  if(action==="recipe-addon-toggle"){
    const id = el.getAttribute("data-item");
    const addonId = el.getAttribute("data-addon");
    const dateStr = el.getAttribute("data-date") || state.viewDate;
    updateDayItem(dateStr, id, function(d){
      const addons = { ...(d.addons||{}) };
      if(el.checked){
        let defaultQty = 1;
        if(d.recipeId==="kanapki"){
          const recipe = findRecipe(d.recipeId);
          const pieczywoGroup = recipe && recipe.variantGroups.find(function(g){ return g.id==="pieczywo"; });
          const chosenId = d.variants && d.variants["pieczywo"];
          const opt = pieczywoGroup && pieczywoGroup.options.find(function(o){ return o.id===chosenId; });
          const firstIng = opt && opt.ingredients && opt.ingredients[0];
          if(chosenId==="bulka") defaultQty = 3;
          else if(firstIng && firstIng.amount) defaultQty = firstIng.amount;
        }
        addons[addonId] = { variants:{}, qty:defaultQty };
      } else { delete addons[addonId]; }
      return { ...d, addons: addons };
    });
    render(); return;
  }
  if(action==="addon-qty"){
    const id = el.getAttribute("data-item");
    const addonId = el.getAttribute("data-addon");
    const dateStr = el.getAttribute("data-date") || state.viewDate;
    const delta = parseInt(el.getAttribute("data-delta"),10);
    updateDayItem(dateStr, id, function(d){
      const addons = { ...(d.addons||{}) };
      const cur = addons[addonId] || { variants:{}, qty:1 };
      const newQty = Math.max(1, (cur.qty||1) + delta);
      addons[addonId] = { ...cur, qty: newQty };
      return { ...d, addons: addons };
    });
    render(); return;
  }
  if(action==="counter-adjust"){
    const id = el.getAttribute("data-item");
    const delta = parseInt(el.getAttribute("data-delta"),10);
    updateDayItem(state.viewDate, id, function(d){
      const newCount = Math.max(0, (d.count||0) + delta);
      return { ...d, count: newCount };
    });
    render(); return;
  }
  if(action==="add-log"){
    const id = el.getAttribute("data-item");
    const ex = document.getElementById("logdraft-"+id+"-exercise").value.trim();
    const w = document.getElementById("logdraft-"+id+"-weight").value.trim();
    const r = document.getElementById("logdraft-"+id+"-reps").value.trim();
    if(!ex) return;
    updateDayItem(state.viewDate, id, function(d){ return { ...d, logEntries: [...(d.logEntries||[]), {exercise:ex, weight:w, reps:r}] }; });
    render(); return;
  }
  if(action==="remove-log"){
    const id = el.getAttribute("data-item");
    const idx = parseInt(el.getAttribute("data-idx"),10);
    updateDayItem(state.viewDate, id, function(d){ return { ...d, logEntries: (d.logEntries||[]).filter(function(_,i){return i!==idx;}) }; });
    render(); return;
  }
  if(action==="add-extra-ingredient"){
    const id = el.getAttribute("data-item");
    const dateStr = el.getAttribute("data-date") || state.viewDate;
    const name = document.getElementById("extradraft-"+id+"-name").value.trim();
    const amount = parseFloat(document.getElementById("extradraft-"+id+"-amount").value) || 0;
    const unit = document.getElementById("extradraft-"+id+"-unit").value;
    if(!name) return;
    updateDayItem(dateStr, id, function(d){ return { ...d, extraIngredients: [...(d.extraIngredients||[]), {name:name, amount:amount, unit:unit}] }; });
    render(); return;
  }
  if(action==="remove-extra-ingredient"){
    const id = el.getAttribute("data-item");
    const dateStr = el.getAttribute("data-date") || state.viewDate;
    const idx = parseInt(el.getAttribute("data-idx"),10);
    updateDayItem(dateStr, id, function(d){ return { ...d, extraIngredients: (d.extraIngredients||[]).filter(function(_,i){return i!==idx;}) }; });
    render(); return;
  }

  if(action==="filter-notes"){ state.notesFilter = el.getAttribute("data-cat"); render(); return; }
  if(action==="set-range"){ state.dashRange = el.getAttribute("data-range"); render(); return; }

  if(action==="pick-list"){ state.manageListId = el.getAttribute("data-item"); render(); return; }
  if(action==="add-list-item"){
    const input = document.getElementById("new-list-item-input");
    const v = input.value.trim();
    const item = findItemMeta(state.manageListId);
    const cur = getEffectiveList(item);
    if(!v || cur.includes(v)) return;
    saveEffectiveList(item, [...cur, v]);
    render(); return;
  }
  if(action==="remove-list-item"){
    const idx = parseInt(el.getAttribute("data-idx"),10);
    const item = findItemMeta(state.manageListId);
    const cur = getEffectiveList(item);
    saveEffectiveList(item, cur.filter(function(_,i){return i!==idx;}));
    render(); return;
  }
  if(action==="refresh-sheet"){
    state.settingsStatus = "Odświeżanie…";
    render();
    fetchAllRows().then(function(){ state.settingsStatus = "Dane odświeżone."; render(); })
      .catch(function(){ state.settingsStatus = "Nie udało się odświeżyć — sprawdź internet."; render(); });
    return;
  }

  if(action==="export-json"){
    const days = {};
    listDates().forEach(function(d){ days[d] = getDayItems(d); });
    const lists = {};
    ALL_ITEMS.filter(function(it){return it.editable;}).forEach(function(it){ lists[it.id] = getEffectiveList(it); });
    const bundle = { exportedAt: new Date().toISOString(), lists: lists, days: days };
    downloadFile("rytualy-dnia-"+todayStr()+".json", JSON.stringify(bundle,null,2), "application/json");
    state.settingsStatus = "Wyeksportowano "+Object.keys(days).length+" dni.";
    render(); return;
  }
  if(action==="export-csv"){
    const rows = [["Data","Kategoria","Aktywność","Zrobione","Notatka / wartość"]];
    listDates().sort().forEach(function(dateStr){
      const dayItems = getDayItems(dateStr).items;
      CATEGORIES.forEach(function(cat){
        cat.items.forEach(function(item){
          const d = dayItems[item.id] || {};
          const done = isItemDone(item,d) ? "tak" : "nie";
          let value = "";
          if(item.type==="note") value = d.note||"";
          else if(item.type==="nested") value = getEffectiveList(item).filter(function(s){return d.subDone&&d.subDone[s];}).join("; ");
          else if(item.type==="log") value = (d.logEntries||[]).map(function(en){return (en.exercise||"")+" "+(en.weight||"")+" x"+(en.reps||"");}).join(" | ");
          else if(item.type==="meal") value = d.mealValue||"";
          else if(item.type==="recipe_meal") value = describeMealSelection(d);
          rows.push([dateStr, cat.name, item.name, done, value]);
        });
      });
    });
    const csv = rows.map(function(r){return r.map(csvEscape).join(",");}).join("\\n");
    downloadFile("rytualy-dnia-"+todayStr()+".csv", csv, "text/csv");
    state.settingsStatus = "Wyeksportowano.";
    render(); return;
  }
}

function handleChange(e){
  const el = e.target;
  const action = el.getAttribute && el.getAttribute("data-action");
  if(action==="meal-select"){
    const id = el.getAttribute("data-item");
    updateDayItem(state.viewDate, id, function(d){ return { ...d, mealValue: el.value }; });
    render(); return;
  }
  if(action==="recipe-select"){
    const id = el.getAttribute("data-item");
    const dateStr = el.getAttribute("data-date") || state.viewDate;
    updateDayItem(dateStr, id, function(d){ return { recipeId: el.value, variants:{}, addons: d.addons||{} }; });
    render(); return;
  }
  if(action==="recipe-variant-select"){
    const id = el.getAttribute("data-item");
    const group = el.getAttribute("data-group");
    const dateStr = el.getAttribute("data-date") || state.viewDate;
    updateDayItem(dateStr, id, function(d){ return { ...d, variants: { ...(d.variants||{}), [group]: el.value } }; });
    render(); return;
  }
  if(action==="recipe-addon-variant"){
    const id = el.getAttribute("data-item");
    const addonId = el.getAttribute("data-addon");
    const group = el.getAttribute("data-group");
    const dateStr = el.getAttribute("data-date") || state.viewDate;
    updateDayItem(dateStr, id, function(d){
      const addons = { ...(d.addons||{}) };
      const cur = addons[addonId] || { variants:{} };
      addons[addonId] = { variants: { ...(cur.variants||{}), [group]: el.value } };
      return { ...d, addons: addons };
    });
    render(); return;
  }
  if(action==="set-custom-start"){ state.dashCustomStart = el.value; render(); return; }
  if(action==="set-custom-end"){ state.dashCustomEnd = el.value; render(); return; }
  if(action==="set-shop-start"){ state.shopStart = el.value; render(); return; }
  if(action==="set-shop-end"){ state.shopEnd = el.value; render(); return; }
  if(action==="set-meal-range-start"){ state.mealRangeStart = el.value; render(); return; }
  if(action==="set-meal-range-end"){ state.mealRangeEnd = el.value; render(); return; }
}

let noteTimer = null;
function handleInput(e){
  const el = e.target;
  const itemId = el.getAttribute && el.getAttribute("data-note-item");
  const mealItemId = el.getAttribute && el.getAttribute("data-meal-note-item");
  const mealKcalItemId = el.getAttribute && el.getAttribute("data-meal-kcal-item");
  if(itemId){
    const val = el.value;
    if(noteTimer) clearTimeout(noteTimer);
    noteTimer = setTimeout(function(){ updateDayItem(state.viewDate, itemId, function(d){ return { ...d, note: val }; }); }, 600);
  } else if(mealItemId){
    const val = el.value;
    const dateStr = el.getAttribute("data-date") || state.viewDate;
    if(noteTimer) clearTimeout(noteTimer);
    noteTimer = setTimeout(function(){ updateDayItem(dateStr, mealItemId, function(d){ return { ...d, note: val }; }); }, 600);
  } else if(mealKcalItemId){
    const val = parseFloat(el.value) || 0;
    const dateStr = el.getAttribute("data-date") || state.viewDate;
    if(noteTimer) clearTimeout(noteTimer);
    noteTimer = setTimeout(function(){ updateDayItem(dateStr, mealKcalItemId, function(d){ return { ...d, manualKcal: val }; }); }, 600);
  } else if(el.getAttribute && el.getAttribute("data-action")==="schedule-search-input"){
    state.scheduleSearchQuery = el.value;
    render();
  }
}
function handleBlur(e){
  const el = e.target;
  const itemId = el.getAttribute && el.getAttribute("data-note-item");
  const mealItemId = el.getAttribute && el.getAttribute("data-meal-note-item");
  const mealKcalItemId = el.getAttribute && el.getAttribute("data-meal-kcal-item");
  if(itemId){
    if(noteTimer) clearTimeout(noteTimer);
    updateDayItem(state.viewDate, itemId, function(d){ return { ...d, note: el.value }; });
  } else if(mealItemId){
    if(noteTimer) clearTimeout(noteTimer);
    const dateStr = el.getAttribute("data-date") || state.viewDate;
    updateDayItem(dateStr, mealItemId, function(d){ return { ...d, note: el.value }; });
  } else if(mealKcalItemId){
    if(noteTimer) clearTimeout(noteTimer);
    const dateStr = el.getAttribute("data-date") || state.viewDate;
    const val = parseFloat(el.value) || 0;
    updateDayItem(dateStr, mealKcalItemId, function(d){ return { ...d, manualKcal: val }; });
  }
}

    render();
    fetchAllRows().then(function(){
      state.screen = "app";
      render();
    }).catch(function(e){
      state.screen = "error";
      state.errorMsg = (e && e.message) ? e.message : "Nie udało się wczytać danych.";
      render();
    });
  } else {
    currentUser = null;
    state.screen = "signin";
    render();
  }
});
</script>
</body>
</html>
